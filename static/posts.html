<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Posts</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        nav {
            margin-bottom: 24px;
        }

        nav a {
            margin-right: 16px;
            text-decoration: none;
            color: blue;
        }

        input,
        textarea {
            display: block;
            margin: 8px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .error {
            color: red;
        }

        .post {
            border: 1px solid #ccc;
            padding: 16px;
            margin-top: 24px;
            border-radius: 4px;
        }

        .post h3 {
            margin: 0 0 4px 0;
        }

        .post .meta {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        .comment {
            border-left: 3px solid #ccc;
            padding: 8px 12px;
            margin: 8px 0;
        }

        .comment .meta {
            color: #888;
            font-size: 0.8em;
        }

        .add-comment {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .add-comment input {
            margin: 0;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/posts.html">Posts</a>
        <a href="/users.html">Users</a>
    </nav>

    <h2>Create Post</h2>
    <input id="user_email" placeholder="Your Email" />
    <input id="title" placeholder="Title" />
    <textarea id="content" placeholder="Content" rows="4"></textarea>
    <button id="create-post-btn">Post</button>
    <p class="error" id="error"></p>

    <h2>Posts</h2>
    <div id="posts"></div>

    <script>
        const API = "";

        async function fetchPosts() {
            const res = await fetch(`${API}/posts`);
            const posts = await res.json();
            const container = document.getElementById("posts");
            container.innerHTML = "";
            for (const p of posts) {
                const div = document.createElement("div");
                div.className = "post";
                div.innerHTML = `
                    <h3>${p.title}</h3>
                    <div class="meta">by ${p.user_name} &middot; ${p.created_at}</div>
                    <p>${p.content}</p>
                    <button class="delete-post-btn">Delete</button>
                    <div id="comments-${p.id}"></div>
                    <div class="add-comment">
                        <input id="comment-user-${p.id}" placeholder="Your User ID" type="number" style="width:120px" />
                        <input id="comment-content-${p.id}" placeholder="Add a comment..." />
                        <button class="add-comment-btn">Comment</button>
                    </div>
                `;

                div.querySelector(".delete-post-btn").addEventListener("click", () => deletePost(p.id));
                div.querySelector(".add-comment-btn").addEventListener("click", () => createComment(p.id));

                container.appendChild(div);
                fetchComments(p.id);
            }
        }

        async function fetchComments(postId) {
            const res = await fetch(`${API}/posts/${postId}/comments`);
            const comments = await res.json();
            const container = document.getElementById(`comments-${postId}`);
            container.innerHTML = comments.map(c => `
                <div class="comment">
                    <div class="meta">User ${c.user_id} &middot; ${c.created_at}</div>
                    <div>${c.content}</div>
                    <button onclick="deleteComment(${c.id}, ${postId})">Delete</button>
                </div>
            `).join("");
        }

        async function createPost() {
            const user_email = document.getElementById("user_email").value;
            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;
            const error = document.getElementById("error");

            const res = await fetch(`${API}/posts`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_email, title, content })
            });

            if (!res.ok) {
                const data = await res.json();
                error.textContent = data.error ?? "Something went wrong";
                return;
            }

            error.textContent = "";
            document.getElementById("user_email").value = "";
            document.getElementById("title").value = "";
            document.getElementById("content").value = "";
            fetchPosts();
        }

        async function deletePost(id) {
            await fetch(`${API}/posts/${id}`, { method: "DELETE" });
            fetchPosts();
        }

        async function createComment(postId) {
            const user_id = parseInt(document.getElementById(`comment-user-${postId}`).value);
            const content = document.getElementById(`comment-content-${postId}`).value;

            const res = await fetch(`${API}/posts/${postId}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ post_id: postId, user_id, content })
            });

            if (!res.ok) {
                const data = await res.json();
                console.error("Comment error:", data);
                alert(data.error ?? "Something went wrong");
                return;
            }

            document.getElementById(`comment-content-${postId}`).value = "";
            document.getElementById(`comment-user-${postId}`).value = "";
            fetchComments(postId);
        }

        async function deleteComment(id, postId) {
            await fetch(`${API}/comments/${id}`, { method: "DELETE" });
            fetchComments(postId);
        }

        document.getElementById("create-post-btn").addEventListener("click", createPost);

        fetchPosts();
    </script>
</body>

</html>
