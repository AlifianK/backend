<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        input {
            display: block;
            margin: 8px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <h2>Create User</h2>
    <input id="name" placeholder="Name" />
    <input id="email" placeholder="Email" />
    <button>Create</button>
    <p class="error" id="error"></p>

    <h2>Users</h2>
    <button>Refresh</button>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="users">
            <tr>
                <td>1</td>
                <td>Ali</td>
                <td>ali@example.com</td>
                <td><button>Delete</button></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
